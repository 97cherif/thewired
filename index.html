<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE WIRED // chat — by 97CHERIF</title>
<meta name="description" content="Serverless chat with friends, rooms, stickers and pictures. By 97CHERIF.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#040a0f;--panel:#08161d;--field:#02080b;--teal:#6fe3d2;--dim:#2c6f6a;--text:#cdeee8;--soft:#6f9a97;--red:#ff3b5c;--blue:#3bd5ff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--text);background:radial-gradient(ellipse at 50% 0%,#0d2a33,transparent 60%),var(--bg);overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.28) 3px);animation:fl 5s infinite steps(1)}
@keyframes fl{0%,100%{opacity:1}92%{opacity:.82}93%{opacity:1}}
#app{height:100%;display:flex;flex-direction:column;max-width:1000px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--dim)}
h1{font:400 clamp(2rem,8vw,3rem)/.9 "VT323",monospace;color:var(--teal);text-shadow:-2px 0 rgba(255,59,92,.55),2px 0 rgba(59,213,255,.55);animation:gl 6s infinite;flex:1}
h1 small{display:block;font:400 12px "IBM Plex Mono",monospace;color:var(--soft);text-shadow:none;letter-spacing:.08em}
h1 small b{color:var(--teal)}
@keyframes gl{0%,90%,100%{transform:none}91%{transform:translateX(-4px) skewX(-6deg)}93%{transform:translateX(5px) skewX(5deg)}95%{transform:none}}
#main{flex:1;display:flex;min-height:0;position:relative}
#side{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--dim);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:12px}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
h2{font:400 18px "VT323",monospace;color:var(--teal);letter-spacing:.06em;margin-bottom:4px}
.row{display:flex;gap:5px;margin-top:4px}
input[type=text]{flex:1;min-width:0;background:var(--field);color:var(--text);border:1px solid var(--dim);padding:7px;font:inherit}
input:focus{outline:1px solid var(--teal)}
button{background:var(--field);color:var(--teal);border:1px solid var(--dim);padding:7px 9px;font:inherit;cursor:pointer}
button:hover{background:var(--teal);color:#000}
.mini{padding:3px 6px;font-size:12px}
.f{display:flex;align-items:center;gap:7px;padding:6px;border:1px solid transparent;cursor:pointer}
.f:hover,.f.on{border-color:var(--dim);background:var(--field)}
.f .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f.un .n{color:var(--blue);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#33474a;flex:none}
.dot.on{background:#4dff9a;box-shadow:0 0 6px #4dff9a}
.hint{color:var(--soft);font-size:12px}
#top{padding:8px 14px;border-bottom:1px solid var(--dim);color:var(--soft);display:flex;gap:10px;align-items:center}
#top b{color:var(--teal);font-weight:600}
#log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.m{max-width:85%;border:1px solid var(--dim);background:var(--panel);padding:6px 9px;word-break:break-word}
.m.me{align-self:flex-end;border-color:var(--teal)}
.who{color:var(--soft);font-size:11px}
.m img{display:block;max-width:100%;max-height:260px;margin-top:4px}
.m img.st{width:96px;height:96px}
.sys{align-self:center;color:var(--soft);font-size:12px;text-align:center}
#tray{display:none;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid var(--dim);background:var(--panel)}
#tray.open{display:flex}
#tray button{padding:2px}#tray img{width:50px;height:50px;display:block}
#prev{display:none;padding:6px 14px;border-top:1px solid var(--dim);color:var(--soft);font-size:12px}
#prev img{height:44px;vertical-align:middle;margin-right:8px}
#bar{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--dim)}
input[type=file]{display:none}
footer{text-align:center;color:var(--soft);font-size:12px;padding:4px}
footer b{color:var(--teal)}
#menu{display:none}
@media(max-width:720px){
 #menu{display:block}
 #side{position:absolute;inset:0 auto 0 0;width:100%;max-width:320px;z-index:5;transform:translateX(-101%);transition:transform .2s}
 #side.open{transform:none}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <button id="menu" type="button">☰</button>
  <h1>THE WIRED<small>friends &amp; rooms // by <b>97CHERIF</b></small></h1>
  <span id="status" class="hint">connecting...</span>
 </header>
 <div id="main">
  <aside id="side">
   <section>
    <h2>YOU</h2>
    <div class="row"><input type="text" id="name" maxlength="16" placeholder="your handle" aria-label="your handle"></div>
    <div class="row"><button class="mini" id="cpid" type="button">copy my ID</button><button class="mini" id="cplink" type="button">copy invite link</button></div>
    <div class="hint" id="myid" style="margin-top:4px;word-break:break-all"></div>
   </section>
   <section>
    <h2>FRIENDS</h2>
    <div id="reqs"></div>
    <div id="flist"></div>
    <div class="row"><input type="text" id="addid" placeholder="paste friend ID or link" aria-label="friend ID"><button id="addbtn" type="button">ADD</button></div>
   </section>
   <section>
    <h2>ROOMS</h2>
    <div class="row"><input type="text" id="rcode" maxlength="12" placeholder="room code" aria-label="room code"><button id="rjoin" type="button">JOIN</button></div>
    <div class="row"><button class="mini" id="rnew" type="button">random room</button></div>
    <div class="hint">Same code = same room. The first person in hosts it.</div>
   </section>
   <section>
    <h2>BACKUP</h2>
    <div class="row"><button class="mini" id="bexp" type="button">export</button><button class="mini" id="bimp" type="button">import</button></div>
    <div class="hint">Your friends live in this browser. Export to keep them.</div>
   </section>
  </aside>
  <div id="chat">
   <div id="top">&gt; pick a friend or join a room</div>
   <div id="log"><div class="sys">&gt; present day. present time.</div></div>
   <div id="tray"></div>
   <div id="prev"></div>
   <div id="bar">
    <button id="stk" type="button" title="stickers">:)</button>
    <button id="pic" type="button" title="picture">IMG</button>
    <input type="file" id="file" accept="image/*">
    <input type="text" id="txt" maxlength="500" placeholder="say something..." autocomplete="off">
    <button id="send" type="button">SEND</button>
   </div>
  </div>
 </div>
 <footer>made by <b>97CHERIF</b></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null};
var rnd=function(n){return Math.random().toString(36).slice(2,2+n)};
var clean=function(s,n){return String(s==null?"":s).slice(0,n)};

/* ---------- identity + friends ---------- */
var me=null;try{me=JSON.parse(LS("w97_me"))}catch(e){}
if(!me||!/^w97-[a-z0-9]{6,12}$/.test(me.id||""))me={id:"w97-"+rnd(10),name:"anon_"+Math.floor(Math.random()*900+100)};
var friends=[];try{friends=JSON.parse(LS("w97_friends"))||[]}catch(e){}
var reqs=[],online={},dconn={},chats={},unread={},active=null,pending=null,room=null,peer=null;
function save(){LS("w97_me",JSON.stringify(me));LS("w97_friends",JSON.stringify(friends))}
function fr(id){for(var i=0;i<friends.length;i++)if(friends[i].id===id)return friends[i];return null}
var validId=function(s){return /^w97-[a-z0-9]{6,12}$/.test(s)};
function parseId(s){s=String(s).trim();var m=s.match(/add=(w97-[a-z0-9]+)/);return m?m[1]:s}
$("name").value=me.name;$("myid").textContent="ID: "+me.id;
$("name").onchange=function(){me.name=clean(this.value.trim(),16)||me.name;this.value=me.name;save()};

/* ---------- stickers ---------- */
var svg=function(b){return "data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#040a0f"/>'+b+'</svg>')};
var S={
 eye:svg('<ellipse cx="50" cy="50" rx="40" ry="22" fill="none" stroke="#6fe3d2" stroke-width="4"/><circle cx="50" cy="50" r="13" fill="#ff3b5c"/><circle cx="50" cy="50" r="5" fill="#000"/>'),
 smile:svg('<circle cx="50" cy="50" r="38" fill="none" stroke="#6fe3d2" stroke-width="4"/><circle cx="37" cy="42" r="5" fill="#6fe3d2"/><circle cx="63" cy="42" r="5" fill="#6fe3d2"/><path d="M32 62 Q50 78 68 62" fill="none" stroke="#6fe3d2" stroke-width="4"/>'),
 heart:svg('<path d="M50 82 L18 50 A18 18 0 0 1 50 28 A18 18 0 0 1 82 50 Z" fill="#ff3b5c"/>'),
 star:svg('<polygon points="50,12 61,40 90,40 66,58 75,87 50,69 25,87 34,58 10,40 39,40" fill="#ffe14d"/>'),
 ghost:svg('<path d="M24 82 V46 A26 26 0 0 1 76 46 V82 L65 72 L50 82 L35 72 Z" fill="#cfd8ff"/><circle cx="41" cy="46" r="5" fill="#000"/><circle cx="59" cy="46" r="5" fill="#000"/>'),
 lain:svg('<text x="50" y="46" font-size="20" fill="#6fe3d2" text-anchor="middle" font-family="monospace">let&apos;s all</text><text x="50" y="70" font-size="20" fill="#ff3b5c" text-anchor="middle" font-family="monospace">love lain</text>'),
 cat:svg('<polygon points="22,44 22,16 44,32" fill="#ffb3c7"/><polygon points="78,44 78,16 56,32" fill="#ffb3c7"/><circle cx="50" cy="56" r="30" fill="#ffb3c7"/><circle cx="40" cy="52" r="4" fill="#000"/><circle cx="60" cy="52" r="4" fill="#000"/><path d="M44 64 L50 69 L56 64" fill="none" stroke="#000" stroke-width="3"/>'),
 glitch:svg('<rect x="10" y="20" width="60" height="14" fill="#ff3b5c"/><rect x="30" y="42" width="60" height="14" fill="#3bd5ff"/><rect x="14" y="64" width="50" height="14" fill="#6fe3d2"/>')
};
Object.keys(S).forEach(function(k){
 var b=document.createElement("button"),i=document.createElement("img");b.type="button";i.src=S[k];i.alt=k;b.appendChild(i);
 b.onclick=function(){out({s:k});$("tray").classList.remove("open")};$("tray").appendChild(b);
});

/* ---------- rendering ---------- */
function sys(t){var s=document.createElement("div");s.className="sys";s.textContent="> "+t;$("log").appendChild(s);$("log").scrollTop=1e9}
function draw(m){
 var el=document.createElement("div");el.className="m"+(m.me?" me":"");
 var w=document.createElement("div");w.className="who";
 w.textContent=m.n+" @ "+new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});el.appendChild(w);
 if(m.x){var p=document.createElement("div");p.textContent=m.x;el.appendChild(p)}
 if(m.s&&S[m.s]){var s=document.createElement("img");s.className="st";s.src=S[m.s];s.alt="sticker";el.appendChild(s)}
 if(m.i){var i=document.createElement("img");i.src=m.i;i.alt="picture";el.appendChild(i)}
 var L=$("log"),bot=L.scrollHeight-L.scrollTop-L.clientHeight<90;L.appendChild(el);if(bot||m.me)L.scrollTop=1e9;
}
function safe(d,mine){
 var m={n:clean(d.n,16)||"anon",t:+d.t||Date.now(),x:clean(d.x,500),s:S[d.s]?d.s:"",i:"",me:!!mine};
 if(typeof d.i==="string"&&d.i.length<200000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(d.i))m.i=d.i;
 return m;
}
function addMsg(key,m){
 (chats[key]=chats[key]||[]).push(m);if(chats[key].length>200)chats[key].shift();
 if(key===active)draw(m);else{unread[key]=1;renderFriends()}
}
function open(key){
 active=key;delete unread[key];$("side").classList.remove("open");
 var L=$("log");L.textContent="";
 var top=$("top");top.textContent="";
 var b=document.createElement("b");
 if(key.indexOf("dm:")===0){var f=fr(key.slice(3));b.textContent=f?f.name:"?";top.appendChild(document.createTextNode("> direct chat with "));top.appendChild(b);
  if(f&&!online[f.id])sys("they are offline — messages only go through while you are both online")}
 else{b.textContent=key.slice(5);top.appendChild(document.createTextNode("> room "));top.appendChild(b);var c=document.createElement("span");c.id="cnt";top.appendChild(c);updCount()}
 (chats[key]||[]).forEach(draw);renderFriends();
}
function renderFriends(){
 var box=$("flist");box.textContent="";
 if(!friends.length){var h=document.createElement("div");h.className="hint";h.textContent="no friends yet. share your invite link!";box.appendChild(h)}
 friends.forEach(function(f){
  var r=document.createElement("div");r.className="f"+(active==="dm:"+f.id?" on":"")+(unread["dm:"+f.id]?" un":"");
  var d=document.createElement("span");d.className="dot"+(online[f.id]?" on":"");
  var n=document.createElement("span");n.className="n";n.textContent=f.name+(f.ok?"":" (pending)");
  var x=document.createElement("button");x.className="mini";x.type="button";x.textContent="✕";x.title="remove";
  x.onclick=function(e){e.stopPropagation();if(confirm("Remove "+f.name+"?")){friends=friends.filter(function(g){return g!==f});save();renderFriends()}};
  r.onclick=function(){open("dm:"+f.id);pingOne(f.id)};
  r.appendChild(d);r.appendChild(n);r.appendChild(x);box.appendChild(r);
 });
 var rb=$("reqs");rb.textContent="";
 reqs.forEach(function(q){
  var r=document.createElement("div");r.className="f";
  var n=document.createElement("span");n.className="n";n.textContent=q.name+" wants to be friends";
  var y=document.createElement("button");y.className="mini";y.type="button";y.textContent="✓";
  var z=document.createElement("button");z.className="mini";z.type="button";z.textContent="✕";
  y.onclick=function(){friends.push({id:q.id,name:q.name,ok:true});reqs=reqs.filter(function(g){return g!==q});save();var c=dconn[q.id];if(c&&c.open)c.send({t:"fa",n:me.name});else pingOne(q.id);renderFriends()};
  z.onclick=function(){reqs=reqs.filter(function(g){return g!==q});renderFriends()};
  r.appendChild(n);r.appendChild(y);r.appendChild(z);rb.appendChild(r);
 });
}

/* ---------- direct connections (friends) ---------- */
function wire(c){
 var go=function(){dconn[c.peer]=c;online[c.peer]=1;c.send({t:"hi",n:me.name});renderFriends()};
 if(c.open)go();else c.on("open",go);
 c.on("data",function(d){
  if(!d||typeof d!=="object")return;var id=c.peer,f=fr(id);
  if(d.t==="hi"){if(f){f.name=clean(d.n,16)||f.name;save();if(!f.ok)c.send({t:"fr",n:me.name})}renderFriends()}
  else if(d.t==="fr"){
   if(f){f.ok=true;f.name=clean(d.n,16)||f.name;save();c.send({t:"fa",n:me.name})}
   else if(!reqs.some(function(q){return q.id===id}))reqs.push({id:id,name:clean(d.n,16)||"someone"});
   renderFriends();
  }
  else if(d.t==="fa"){if(f){f.ok=true;save();sys(f.name+" accepted your request")}renderFriends()}
  else if(d.t==="dm"&&f&&f.ok){addMsg("dm:"+id,safe(d,false))}
 });
 var gone=function(){if(dconn[c.peer]===c){delete dconn[c.peer];delete online[c.peer];renderFriends()}};
 c.on("close",gone);c.on("error",gone);
}
function pingOne(id){
 if(!peer||!peer.open||(dconn[id]&&dconn[id].open))return;
 var c=peer.connect(id,{reliable:true}),t=setTimeout(function(){if(!c.open){try{c.close()}catch(e){}}},6000);
 wire(c);c.on("open",function(){clearTimeout(t)});
}
function pingAll(){friends.forEach(function(f){pingOne(f.id)})}
function addFriend(raw){
 var id=parseId(raw);
 if(!validId(id)){alert("That doesn't look like a valid ID.");return}
 if(id===me.id){alert("That's your own ID :)");return}
 if(fr(id)){alert("Already in your list.");return}
 friends.push({id:id,name:"friend_"+id.slice(4,8),ok:false});save();renderFriends();pingOne(id);
 sys("request sent. they need to be online to accept.");
}

/* ---------- rooms (first in = host, star topology) ---------- */
function updCount(n){var c=$("cnt");if(c&&room&&active==="room:"+room.code){if(n!=null)room.n=n;c.textContent=" · "+(room.n||1)+" here"}}
function leaveRoom(){
 if(!room)return;
 try{if(room.host)room.host.destroy()}catch(e){}
 try{if(room.conn)room.conn.close()}catch(e){}
 room=null;
}
function joinRoom(raw){
 var code=String(raw).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,12);
 if(!code){return}
 if(!peer||!peer.open){alert("Still connecting, try again in a second.");return}
 leaveRoom();var key="room:"+code,rid="w97room-"+code.toLowerCase();
 room={code:code,rid:rid,members:{},host:null,conn:null,n:1};
 chats[key]=chats[key]||[];open(key);sys("joining room "+code+"...");
 var R=room,hp=new Peer(rid);
 hp.on("open",function(){if(room!==R)return;R.host=hp;sys("you are hosting this room. if you leave, it closes.");updCount(1)});
 hp.on("connection",function(c){
  c.on("open",function(){
   R.members[c.peer]=c;
   c.send({t:"hist",m:(chats[key]||[]).slice(-30).map(function(m){return{n:m.n,t:m.t,x:m.x,s:m.s,i:m.i}})});
   bcast({t:"n",n:Object.keys(R.members).length+1});updCount(Object.keys(R.members).length+1);
  });
  c.on("data",function(d){
   if(!d||d.t!=="rm")return;var m=safe({n:d.n,t:d.ts,x:d.x,s:d.s,i:d.i},false);
   addMsg(key,m);bcast({t:"rm",n:m.n,x:m.x,s:m.s,i:m.i,ts:m.t},c.peer);
  });
  var gone=function(){if(R.members[c.peer]){delete R.members[c.peer];bcast({t:"n",n:Object.keys(R.members).length+1});updCount(Object.keys(R.members).length+1)}};
  c.on("close",gone);c.on("error",gone);
 });
 hp.on("error",function(e){
  if(room!==R)return;
  if(e.type==="unavailable-id"){
   try{hp.destroy()}catch(x){}
   var c=peer.connect(rid,{reliable:true});
   c.on("open",function(){if(room!==R)return;R.conn=c;sys("connected to room "+code)});
   c.on("data",function(d){
    if(!d)return;
    if(d.t==="rm")addMsg(key,safe({n:d.n,t:d.ts,x:d.x,s:d.s,i:d.i},false));
    else if(d.t==="hist"&&Array.isArray(d.m)&&!R.gotHist){R.gotHist=1;d.m.forEach(function(m){addMsg(key,safe(m,false))})}
    else if(d.t==="n")updCount(+d.n||1);
   });
   c.on("close",function(){if(room===R){R.conn=null;sys("the host left. press JOIN to take over the room.")}});
  }else sys("room error: "+e.type);
 });
}
function bcast(d,except){if(!room)return;Object.keys(room.members).forEach(function(id){if(id!==except&&room.members[id].open)room.members[id].send(d)})}

/* ---------- sending ---------- */
function out(x){
 if(!active){sys("pick a friend or join a room first");return}
 var t=Date.now(),m=safe({n:me.name,t:t,x:x.x,s:x.s,i:x.i},true);
 if(!m.x&&!m.s&&!m.i)return;
 if(active.indexOf("dm:")===0){
  var id=active.slice(3),c=dconn[id];
  if(!c||!c.open){sys("they are offline, message not sent");pingOne(id);return}
  c.send({t:"dm",n:m.n,x:m.x,s:m.s,i:m.i,ts:t});
 }else{
  if(!room||"room:"+room.code!==active){sys("you are not connected to this room, press JOIN");return}
  if(room.host)bcast({t:"rm",n:m.n,x:m.x,s:m.s,i:m.i,ts:t});
  else if(room.conn&&room.conn.open)room.conn.send({t:"rm",n:m.n,x:m.x,s:m.s,i:m.i,ts:t});
  else{sys("not connected yet, try again");return}
 }
 addMsg(active,m);
}
function send(){
 var t=$("txt").value.trim();if(!t&&!pending)return;
 out({x:t,i:pending});$("txt").value="";pending=null;$("prev").style.display="none";$("prev").textContent="";
}
$("send").onclick=send;
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();send()}});
$("stk").onclick=function(){$("tray").classList.toggle("open")};
$("pic").onclick=function(){$("file").click()};
$("file").onchange=function(){
 var f=this.files[0];this.value="";if(!f||!/^image\//.test(f.type))return;
 var url=URL.createObjectURL(f),im=new Image();
 im.onload=function(){
  var r=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  var q=.7,o=c.toDataURL("image/jpeg",q);while(o.length>150000&&q>.2){q-=.1;o=c.toDataURL("image/jpeg",q)}
  if(o.length>190000){sys("picture too big, try another");return}
  pending=o;var p=$("prev");p.style.display="block";p.textContent="";var t=document.createElement("img");t.src=o;t.alt="";p.appendChild(t);p.appendChild(document.createTextNode("picture ready, press SEND"));
 };
 im.onerror=function(){URL.revokeObjectURL(url);sys("could not read that picture")};im.src=url;
};

/* ---------- buttons ---------- */
function copy(t,ok){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){sys(ok)},function(){prompt("Copy this:",t)})}
var inviteLink=function(){return location.origin+location.pathname+"#add="+me.id};
$("cpid").onclick=function(){copy(me.id,"ID copied")};
$("cplink").onclick=function(){copy(inviteLink(),"invite link copied, send it to your friend")};
$("addbtn").onclick=function(){addFriend($("addid").value);$("addid").value=""};
$("rjoin").onclick=function(){joinRoom($("rcode").value)};
$("rnew").onclick=function(){var c=rnd(6).toUpperCase();$("rcode").value=c;joinRoom(c)};
$("menu").onclick=function(){$("side").classList.toggle("open")};
$("bexp").onclick=function(){copy(btoa(unescape(encodeURIComponent(JSON.stringify({me:me,friends:friends})))),"backup code copied, keep it somewhere safe")};
$("bimp").onclick=function(){
 var s=prompt("Paste your backup code:");if(!s)return;
 try{var d=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
  if(!d.me||!validId(d.me.id))throw 0;me={id:d.me.id,name:clean(d.me.name,16)||"anon"};
  friends=(d.friends||[]).filter(function(f){return validId(f.id)}).map(function(f){return{id:f.id,name:clean(f.name,16),ok:!!f.ok}});
  save();alert("Imported. The page will reload.");location.reload();
 }catch(e){alert("That backup code is not valid.")}
};

/* ---------- start ---------- */
function start(){
 if(!window.Peer){$("status").textContent="could not load PeerJS";return}
 peer=new Peer(me.id);
 peer.on("open",function(){
  $("status").textContent="online";renderFriends();pingAll();setInterval(pingAll,25000);
  var m=location.hash.match(/add=(w97-[a-z0-9]+)/);
  if(m){history.replaceState(null,"",location.pathname);if(m[1]!==me.id&&!fr(m[1])&&confirm("Add this person as a friend?"))addFriend(m[1])}
 });
 peer.on("connection",wire);
 peer.on("disconnected",function(){$("status").textContent="reconnecting...";try{peer.reconnect()}catch(e){}});
 peer.on("error",function(e){
  if(e.type==="unavailable-id")$("status").textContent="this ID is open in another tab";
  else if(e.type!=="peer-unavailable")$("status").textContent="error: "+e.type;
 });
}
renderFriends();start();
})();
</script>
